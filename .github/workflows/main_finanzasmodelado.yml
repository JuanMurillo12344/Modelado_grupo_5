name: Build and deploy Node.js app to Azure Web App - finanzasmodelado

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: npm install and build
        run: |
          npm install
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PRIVATE_STANDALONE: true

      - name: Prepare standalone artifact
        run: |
          # 1. Nos aseguramos de estar en la raíz del build
          # 2. Copiamos los archivos necesarios para que server.js no se pierda
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone # Subimos SOLO el contenido de esta carpeta

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'finanzasmodelado'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0B1DF4429B334FD2AAAC5E81B481F224 }}
          package: . # Se despliega en la raíz de Azure
