name: Build and deploy Node.js app to Azure Web App - finanzasmodelado

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4 # Actualizado a v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: npm install and build
        run: |
          npm install
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PRIVATE_STANDALONE: true

      - name: Prepare standalone artifact
        run: |
          # Copiamos archivos necesarios dentro de la carpeta standalone antes de subirla
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'finanzasmodelado'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0B1DF4429B334FD2AAAC5E81B481F224 }}
          package: . # Ahora esto contiene directamente el contenido de standalone
